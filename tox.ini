
[tox]
requires =
    tox>=4
env_list = py311, py312, py313, py314, py315, lint

[testenv]
description = Run unit tests
package = wheel
extras = test
commands =
    pytest tests --basetemp={envtmpdir}

[testenv:lint]
description = Run flake8
base_python = python3.14
skip_install = true
deps = flake8>=7
commands =
    flake8 dotwiz tests

[gh]
python =
    3.11 = py311
    3.12 = py312
    3.13 = py313
    3.14 = py314, lint
    3.15 = py315
